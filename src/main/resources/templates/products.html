<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Products - Hazmat Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            background: #17365d;
            padding: 12px 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1f4e79;
            color: white;
        }

        .empty {
            padding: 20px;
            background: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Industrial Chemical Safety & Hazardous Material Storage Tracker</h1>
</header>

<nav>
    <a href="/">Dashboard</a>
    <a href="/products">Products</a>
</nav>

<div class="container">

    <h2>Products</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Type</th>
            <th>Unit Price</th>
            <th>Unit</th>
            <th>Hazard Class</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.type}"></td>
            <td th:text="${product.unitPrice}"></td>
            <td th:text="${product.unitOfMeasure}"></td>
            <td th:text="${product.hazardClass}"></td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
