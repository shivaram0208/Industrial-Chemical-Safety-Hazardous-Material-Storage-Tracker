<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Budget Variance Report</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 20px;
        }

        nav {
            background: #17365d;
            padding: 12px 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        button {
            padding: 10px 18px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1f4e79;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Budget Variance Report</h1>
</header>

<nav>
    <a th:href="@{/}">Dashboard</a>
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/storage}">Storage</a>
    <a th:href="@{/intake}">Intake</a>
    <a th:href="@{/inspection}">Inspection</a>
    <a th:href="@{/procurement}">Procurement</a>
    <a th:href="@{/sales}">Sales</a>
    <a th:href="@{/budget-variance}">Reports</a>
</nav>

<div class="container">

    <div class="card">

        <h2>Budget Variance</h2>

        <button onclick="loadReport()">
            Load Budget Variance
        </button>

        <table id="reportTable">
            <thead>
            <tr id="headerRow"></tr>
            </thead>

            <tbody id="reportBody"></tbody>
        </table>

    </div>

</div>

<script>

    async function loadReport() {

        try {

            const response =
                await fetch('/api/reports/budget-variance');

            if (!response.ok) {
                throw new Error('Failed to load budget report');
            }

            const data = await response.json();

            const headerRow =
                document.getElementById('headerRow');

            const body =
                document.getElementById('reportBody');

            headerRow.innerHTML = '';
            body.innerHTML = '';

            if (!data || data.length === 0) {

                headerRow.innerHTML =
                    '<th>No Data</th>';

                body.innerHTML =
                    '<tr><td>No budget variance data available.</td></tr>';

                return;
            }

            const columns =
                Object.keys(data[0]);

            columns.forEach(column => {

                const th = document.createElement('th');

                th.textContent = column;

                headerRow.appendChild(th);
            });

            data.forEach(row => {

                const tr = document.createElement('tr');

                columns.forEach(column => {

                    const td =
                        document.createElement('td');

                    td.textContent =
                        row[column] ?? '';

                    tr.appendChild(td);
                });

                body.appendChild(tr);
            });

        } catch (error) {

            alert(error.message);

        }
    }

</script>

</body>
</html>
