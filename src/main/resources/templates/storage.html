<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Storage - Hazmat Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 20px;
        }

        nav {
            background: #17365d;
            padding: 12px 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        button {
            padding: 10px 18px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        pre {
            background: #222;
            color: #eee;
            padding: 20px;
            overflow: auto;
        }
    </style>
</head>

<body>

<header>
    <h1>Industrial Chemical Safety & Hazardous Material Storage Tracker</h1>
</header>

<nav>
    <a th:href="@{/}">Dashboard</a>
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/storage}">Storage</a>
    <a th:href="@{/intake}">Intake</a>
    <a th:href="@{/inspection}">Inspection</a>
    <a th:href="@{/procurement}">Procurement</a>
    <a th:href="@{/sales}">Sales</a>
    <a th:href="@{/budget-variance}">Reports</a>
</nav>

<div class="container">

    <div class="card">
        <h2>Storage Vaults</h2>
        <p>View all hazardous material storage vaults.</p>

        <button onclick="loadVaults()">Load Storage Vaults</button>

        <pre id="result">Click the button to load data.</pre>
    </div>

</div>

<script>
    async function loadVaults() {
        try {
            const response = await fetch('/api/hazmat/vaults');

            if (!response.ok) {
                throw new Error('Failed to load vaults');
            }

            const data = await response.json();

            document.getElementById('result').textContent =
                JSON.stringify(data, null, 2);

        } catch (error) {
            document.getElementById('result').textContent =
                'Error: ' + error.message;
        }
    }
</script>

</body>
</html>
